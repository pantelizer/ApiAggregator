# Runs the API together with Redis (FusionCache's L2 + backplane).
#
#   docker compose up --build                 -> API on http://localhost:8080 (Swagger at /swagger)
#   docker compose up redis                   -> only Redis, for running the API from your IDE
#   docker compose --profile tools up --build -> also starts RedisInsight on http://localhost:5540
#
# API keys and the JWT signing key come from a .env file next to this one (see .env.example).

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables Swagger UI
      Caching__RedisConnectionString: "redis:6379"
      ExternalApis__Weather__ApiKey: ${WEATHER_API_KEY:-PLACE_YOUR_API_KEY_HERE}
      ExternalApis__News__ApiKey: ${NEWS_API_KEY:-PLACE_YOUR_API_KEY_HERE}
      ExternalApis__GitHub__ApiKey: ${GITHUB_TOKEN:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-REPLACE_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_LONG}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    # Append-only file so cached data survives a container restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional web UI for browsing the cached keys. Connect it to host "redis", port 6379.
  redisinsight:
    image: redis/redisinsight:2.70
    profiles: ["tools"]
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redis-data:
